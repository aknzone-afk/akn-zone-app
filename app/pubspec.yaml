name: catalog_app
description: "B.B Synthetics fabric catalog — browse, filter, mark up and share via WhatsApp. Mirrors a public Google Drive folder."
publish_to: 'none'
version: 2.3.5+66

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.6.0
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.0

  # Local storage
  sqflite: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Image caching + display
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0

  # Drive HTML parsing
  html: ^0.15.4

  # Periodic background refresh (no notification, no foreground service)
  workmanager: ^0.9.0+3

  # Sharing + WhatsApp
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Export the cart as a single PDF
  pdf: ^3.10.0

  # On-device OCR for photos whose folder name doesn't encode a price.
  google_mlkit_text_recognition: ^0.13.0
  flutter_local_notifications: ^22.0.0-dev.3
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  flutter_image_compress: ^2.4.0
  package_info_plus: ^9.0.1
  youtube_player_iframe: ^6.0.2
  flutter_secure_storage: 9.2.4
  image_picker: 1.1.2
  app_badge_plus: ^1.3.5
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/seed/seed_manifest.json
    - assets/data/transports.json
  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/Playfair-400.ttf
        - asset: assets/fonts/Playfair-600.ttf
          weight: 600
        - asset: assets/fonts/Playfair-700.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_background: "#FAF7F2"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  min_sdk_android: 21
