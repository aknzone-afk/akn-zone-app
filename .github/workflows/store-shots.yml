# Store screenshots (owner 25-Oct-2026): the real app on an Android
# emulator with the store-review demo account; PNGs as an artifact.
name: Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: app
          script: flutter drive --driver=test_driver/shots.dart --target=integration_test/store_shots_test.dart --no-dds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-screenshots
          path: app/screenshots/
